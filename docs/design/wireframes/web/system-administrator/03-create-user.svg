</text>
<text x="252" y="130.5" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">
<tspan x="252" dy="0">Create staff user</tspan>
</text>
<line x1="252" y1="164" x2="1388" y2="164" stroke="#999999" stroke-width="1"/>
<rect x="438" y="188" width="760" height="500" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="456" y="219.0" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">
