</text>
<rect x="1032" y="614" width="132" height="38" rx="0" fill="#DDDDDD" stroke="#444444" stroke-width="1"/>
<text x="1098.0" y="638.0" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
<tspan x="1098.0" dy="0">Create user</tspan>
</text>
</svg>