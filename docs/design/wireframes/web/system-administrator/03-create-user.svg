</text>
<text x="466" y="354.5" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="466" dy="0">Phone number *</tspan>
</text>
<rect x="466" y="364" width="336" height="40" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="478" y="389.0" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="478" dy="0">9–11 digits</tspan>
</text>
<text x="828" y="354.5" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="828" dy="0">Temporary password *</tspan>
</text>
<rect x="828" y="364" width="336" height="40" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="840" y="389.0" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="840" dy="0">Minimum 8 characters</tspan>
</text>
<text x="466" y="448.5" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="466" dy="0">Role *</tspan>
</text>
<rect x="466" y="458" width="698" height="40" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="478" y="483.0" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="478" dy="0">Dispatcher</tspan>
</text>
<rect x="466" y="542" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="496" y="556.0" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">
