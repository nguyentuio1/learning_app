</text>
<text x="466" y="260.5" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="466" dy="0">Full name *</tspan>
</text>
<rect x="466" y="270" width="336" height="40" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="478" y="295.0" fill="#555555" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">
