</text>
<rect x="888" y="614" width="130" height="38" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
<text x="953.0" y="638.0" fill="#222222" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
