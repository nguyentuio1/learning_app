# LA-181: the full system (PostgreSQL, MinIO, API, web portal) with one command:
#   cp .env.example .env   # replace every value first
#   docker compose up -d --build --wait     # --wait returns once the api health check passes (LA-178)
# Infrastructure only, for `dotnet run` / `npm run dev`:  docker compose up -d postgres minio
# The passwords come from .env (LA-328); compose stops when a required value is missing.
services:
  postgres:
    image: postgres:16-alpine
    container_name: drone_postgres
    restart: always
    environment:
      POSTGRES_DB: drone_delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drone_delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: drone_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    image: smart-drone-delivery-api:local
    container_name: drone_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=drone_delivery_db;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (see .env.example)}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      # Address of MinIO as browsers and phones see it (avatar and package photo URLs).
      Minio__PublicBaseUrl: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      # Optional: creates the first administrator on the first start (LA-328).
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@smartdronedelivery.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      # Optional: demo simulator settings (LA-186 / LA-188); default off in non-demo runs.
      DroneSimulator__Enabled: ${DroneSimulator__Enabled:-false}
      DeliveryFlight__CruiseSpeedMps: ${DeliveryFlight__CruiseSpeedMps:-12}
    ports:
      # Same port as `dotnet run`, so the mobile apps work unchanged. Stop one before starting the other.
      - "${API_HOST_PORT:-5055}:8080"
    # LA-178: /health/ready checks PostgreSQL and MinIO. The runtime image has bash but no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend/web
    image: smart-drone-delivery-web:local
    container_name: drone_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  postgres_data:
  minio_data:
